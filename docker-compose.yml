version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dayflow_db
    restart: always
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow_secret_password
      POSTGRES_DB: dayflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://dayflow:dayflow_secret_password@db:5432/dayflow_db
      SECRET_KEY: dayflow_super_secure_jwt_secret_key_change_in_production_2026!
      REFRESH_TOKEN_SECRET: dayflow_super_secure_refresh_secret_key_change_in_production_2026!
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost:80"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dayflow_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
